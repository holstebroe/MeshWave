syntax = "proto3";

option csharp_namespace = "MeshWave.Common.Core.Serialization.Protobuf";

import "google/protobuf/timestamp.proto";

enum ProtoManifestStreamType {
    CONTENT = 0;
    INTERACTION = 1;
    SOCIAL = 2;
}

enum ProtoManifestOperationType {
    CREATE = 0;
    UPDATE = 1;
    DELETE = 2;
    PLAY = 3;
    FOLLOW = 4;
    UNFOLLOW = 5;
    PROFILE = 6;
    COMMENT = 7;
    COMMENT_DELETE = 8;
    FRIEND_ADD = 9;
    FRIEND_REMOVE = 10;
    GROUP_JOIN = 11;
    GROUP_LEAVE = 12;
    LIKE = 13;
    UNLIKE = 14;
    CREATE_COMPETITION = 15;
    COMPETITION_SUBMIT = 16;
    COMPETITION_CAST_VOTE = 17;
    COMPETITION_REVEAL_RESULTS = 18;
    CREATE_CHANNEL = 19;
    POST_MESSAGE = 20;
    FOUND_GROUP = 21;
    MODERATE_GROUP = 22;

    UNKNOWN = 999;
}

message ProtoManifestOperation {
    string operation_id = 1;
    ProtoManifestOperationType operation_type = 2;
    string target_id = 3;
    string target_type = 4;
    optional string content_hash = 5;
    int32 sequence_number = 6;
    bytes signature = 7;
    google.protobuf.Timestamp timestamp = 8;
    map<string, string> metadata = 9;
    optional string shader_script = 10;
    string prev_hash = 11;
}

message ProtoSnapshotStateEntry {
    string target_id = 1;
    string target_type = 2;
    optional string content_hash = 3;
    map<string, string> metadata = 4;
    optional string shader_script = 5;
}

message ProtoManifestSnapshot {
    int32 last_sequence_number = 1;
    google.protobuf.Timestamp timestamp = 2;
    bytes signature = 3;
    optional string library_state_digest = 4;
    map<string, int32> play_counts = 5;
    repeated string followed_user_ids = 6;
    repeated string liked_track_ids = 7;
    repeated string friend_user_ids = 8;
    repeated string group_ids = 9;
    repeated ProtoSnapshotStateEntry entity_states = 10;
    repeated ProtoManifestOperation persistent_operations = 11;
    string head_hash = 12;
}

message ProtoManifest {
    string user_id = 1;
    ProtoManifestStreamType stream_type = 2;
    optional ProtoManifestSnapshot snapshot = 3;
    repeated ProtoManifestOperation operations = 4;
    int32 version = 5;
    google.protobuf.Timestamp last_updated = 6;
    optional string author_public_key = 7;
    bool has_more = 8;
}

message ProtoStreamHead {
    string user_id = 1;
    ProtoManifestStreamType stream_type = 2;
    int32 head_sequence_number = 3;
    string head_hash = 4;
}

message ProtoPeerInfo {
    string user_id = 1;
    string display_name = 2;
    string address = 3;
    int32 port = 4;
    string public_key_pem = 5;
    google.protobuf.Timestamp last_seen = 6;
    repeated string capabilities = 7;
    optional google.protobuf.Timestamp signed_at = 8;
    string signature = 9;
}

enum ProtoManifestRequestType {
    GET_MANIFEST = 0;
    PUSH_MANIFEST = 1;
    GET_PEERS = 2;
    reserved 3, 5; // REQUEST_RENDEZVOUS, RELAY_MANIFEST_PUSH (removed)
    REQUEST_CONTENT = 4;
    ANNOUNCE = 6;
    OPEN_SESSION = 7;
    PING = 8;
    REQUEST_INTRODUCTION = 9;
    INTRODUCTION_OFFER = 10;
    HELLO = 11;
    GET_HEADS = 12;
}

message ProtoSessionHello {
    optional ProtoPeerInfo peer = 1;
    int64 nonce = 2;
    string proof = 3;
    int32 udp_port = 4;
    bool is_introducer = 5;
}

message ProtoIntroduction {
    string requester_user_id = 1;
    string target_user_id = 2;
    string token = 3;
    int32 introducer_udp_port = 4;
}

message ProtoManifestRequest {
    ProtoManifestRequestType type = 1;
    ProtoManifestStreamType stream_type = 2;
    optional ProtoManifest manifest = 3;
    reserved 4, 9; // rendezvous, target_user_id (relay fetch; removed)
    optional string content_hash = 5;
    optional ProtoPeerInfo announcing_peer = 6;
    int32 start_sequence_number = 7;
    optional int32 end_sequence_number = 8;
    optional int64 chunk_offset = 10;
    optional int64 chunk_length = 11;
    optional ProtoSessionHello hello = 12;
    optional ProtoIntroduction introduction = 13;
    optional string target_user_id = 14;
}

message ProtoManifestResponse {
    optional ProtoManifest manifest = 1;
    bool acknowledged = 2;
    repeated ProtoPeerInfo peers = 3;
    reserved 4; // rendezvous (removed)
    optional bytes content_bytes = 5;
    int64 content_length = 6;
    optional int64 total_content_length = 7;
    optional ProtoSessionHello hello = 8;
    optional ProtoIntroduction introduction = 9;
    optional string observed_address = 10;
    optional bool dial_back_succeeded = 11;
    repeated ProtoStreamHead heads = 12;
}
