name: Jules Move to Review

on:
  pull_request:
    types: [opened]

jobs:
  move-to-review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Pivot Labels to Under Review
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo;

            const query = `query($owner: String!, $repo: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  closingIssuesReferences(first: 5) {
                    nodes {
                      number
                      labels(first: 100) {
                        nodes { name }
                      }
                    }
                  }
                }
              }
            }`;

            const result = await github.graphql(query, { owner: repo.owner, repo: repo.repo, pr: prNumber });
            const linkedIssues = result.repository.pullRequest.closingIssuesReferences.nodes;

            for (const issue of linkedIssues) {
              const labelNames = issue.labels.nodes.map(l => l.name);
              
              if (labelNames.includes('jules-in-progress')) {
                // Add the review state
                await github.rest.issues.addLabels({
                  owner: repo.owner, repo: repo.repo, issue_number: issue.number,
                  labels: ['jules-under-review']
                });
                // Remove the execution state
                await github.rest.issues.removeLabel({
                  owner: repo.owner, repo: repo.repo, issue_number: issue.number,
                  name: 'jules-in-progress'
                });
              }
            }