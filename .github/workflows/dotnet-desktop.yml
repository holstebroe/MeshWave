name: MeshWave Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    env:
      Solution_Name: MeshWave.slnx

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build (${{ matrix.configuration }})
      run: dotnet build $env:Solution_Name --configuration ${{ matrix.configuration }} --no-restore

    - name: Test (${{ matrix.configuration }})
      # Added --filter to exclude the integration test assembly namespace
      run: dotnet test $env:Solution_Name --configuration ${{ matrix.configuration }} --no-build --filter "FullyQualifiedName!~MeshWave.Integration.Tests" --logger "trx;LogFileName=test-results-${{ matrix.configuration }}.trx"

    - name: Upload test results (${{ matrix.configuration }})
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.configuration }}
        path: "**/TestResults/test-results-${{ matrix.configuration }}.trx"
