name: Jules Issue Developer

on:
  issues:
    types: [labeled]

jobs:
  trigger-jules:
    if: >
      github.event.label.name == 'jules-task' && 
      !contains(github.event.issue.labels.*.name, 'jules-in-progress') &&
      !contains(github.event.issue.labels.*.name, 'jules-under-review')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write       
      pull-requests: write  
    steps:
      # 1. Add the in-progress badge and clear out previous failure flags
      - name: Lock Issue to In-Progress
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            const currentLabels = issue.labels.map(l => l.name);

            await github.rest.issues.addLabels({
              owner, repo, issue_number,
              labels: ['jules-in-progress']
            });

            if (currentLabels.includes('jules-implementation-failed')) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'jules-implementation-failed' });
            }

      # 2. Check out the codebase context explicitly (needed for generating git logs/diffs)
      - name: Checkout Codebase Context
        uses: actions/checkout@v5
        with:
          fetch-depth: 20

      # 3. Native Execution & Local Verification Step
      - name: Run Jules Implementer
        id: jules_step
        run: |
          echo "Assembling prompt and system context strings..."
          
          # Reconstruct prompt structure matching Jules requirements
          echo "${{ github.event.issue.title }}" > user_prompt.txt
          echo "${{ github.event.issue.body }}" >> user_prompt.txt
          echo -e '\n\nContent of the latest commit (in the format of `git show`):' >> user_prompt.txt
          git show --stat >> user_prompt.txt || true
          echo -e '\n\nLog of the last 20 commits (in the format of `git log --stat`):' >> user_prompt.txt
          git log -n 20 --stat >> user_prompt.txt || true

          # Read system instructions from repository variables safely
          SYSTEM_INSTRUCTIONS=$(cat << 'EOF'
          ${{ vars.JULES_ISSUE_DEVELOPER_PROMPT }}
          EOF
          )
          echo -e "\n\n--------------------------------------------------\nSYSTEM INSTRUCTIONS:\n$SYSTEM_INSTRUCTIONS" >> user_prompt.txt

          echo "Building JSON payload structure..."
          jq -n \
            --arg jules_prompt "$(cat user_prompt.txt)" \
            --arg starting_branch "master" \
            --arg repo_full_name "${{ github.repository }}" \
            '{
              prompt: $jules_prompt,
              sourceContext: {
                source: ("sources/github/" + $repo_full_name),
                githubRepoContext: {
                  startingBranch: $starting_branch
                }
              },
              automationMode: "AUTO_CREATE_PR"
            }' > jules_payload.json

          echo "Invoking Jules Remote AI Agent..."
          # Send request and append HTTP status code locally to the response variable
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.JULES_API_KEY }}" \
            -d @jules_payload.json \
            'https://jules.googleapis.com/v1alpha/sessions')

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          
          echo "$BODY" > response.json

          # Verify if the API request failed
          if [ "$HTTP_STATUS" -ne 200 ] || jq -e '.error' response.json >/dev/null 2>&1; then
            echo "=============================================================================="
            echo "❌ CRITICAL: Jules API session initialization failed."
            echo "=============================================================================="
            
            ERROR_STATUS=$(jq -r '.error.status // "UNKNOWN_STATUS"' response.json)
            ERROR_MSG=$(jq -r '.error.message // "No descriptive text returned."' response.json)
            
            if [ "$ERROR_STATUS" = "FAILED_PRECONDITION" ]; then
              DIAGNOSIS="BURST CONCURRENCY COLLISION (FAILED_PRECONDITION) - Too many Jules agents launched simultaneously or AI Studio session limits hit."
            elif [ "$HTTP_STATUS" = "403" ] || [ "$ERROR_STATUS" = "PERMISSION_DENIED" ]; then
              DIAGNOSIS="AUTHENTICATION FAILURE (403) - The JULES_API_KEY is invalid, restricted, or expired."
            elif [ "$HTTP_STATUS" = "429" ] || [ "$ERROR_STATUS" = "RESOURCE_EXHAUSTED" ]; then
              DIAGNOSIS="QUOTA EXHAUSTED (429) - Daily or per-minute token allocation limits reached."
            else
              DIAGNOSIS="GENERAL API VALIDATION ERROR ($HTTP_STATUS) - $ERROR_MSG"
            fi

            # 1. Raise Workflow Error Annotation
            echo "::error title=Jules Launch Failure::$DIAGNOSIS"

            # 2. Generate Rich Summary Dashboard UI Card
            echo "### ❌ Jules Agent Initialization Failed" >> $GITHUB_STEP_SUMMARY
            echo "The automated coding agent failed to initialize a development session with Google's API." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **Diagnosis:** $DIAGNOSIS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 📄 Technical Error Snippet:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat response.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "The issue labels have been automatically rolled back to allow a clean retry on the next cycle." >> $GITHUB_STEP_SUMMARY
            
            exit 1
          else
            echo "✅ Clean session deployment initialized successfully."
            echo "Session ID: $(jq -r '.id // .name' response.json)"
          fi

      # 4. SELF-HEALING RECOVERY: Triggers instantly if step 3 runs into an error status
      - name: Revert Labels on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            const currentLabels = issue.labels.map(l => l.name);

            if (currentLabels.includes('jules-in-progress')) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'jules-in-progress' });
            }
            if (currentLabels.includes('jules-task')) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'jules-task' });
            }
            if (!currentLabels.includes('jules-implementation-failed')) {
              await github.rest.issues.addLabels({ 
                owner, repo, issue_number, 
                labels: ['jules-implementation-failed'] 
              });
            }
            console.log(`Successfully reset Issue #${issue_number} labels following a verified launch failure.`);
