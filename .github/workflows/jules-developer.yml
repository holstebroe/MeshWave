name: Jules Issue Developer

on:
  issues:
    types: [labeled]

jobs:
  trigger-jules:
    if: >
      github.event.label.name == 'jules-task' && 
      !contains(github.event.issue.labels.*.name, 'jules-in-progress') &&
      !contains(github.event.issue.labels.*.name, 'jules-under-review')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write       
      pull-requests: write  
      actions: read         # Crucial: Allows this job to read its own execution logs
    steps:
      # 1. Add the in-progress badge
      - name: Lock Issue to In-Progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['jules-in-progress']
            });
            
      # 2. Run Jules (which might fail silently with a green checkmark)
      - name: Run Jules Implementer
        id: jules_step
        uses: google-labs-code/jules-invoke@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          prompt: |
            ISSUE_TITLE: ${{ github.event.issue.title }}
            ISSUE_NUMBER: ${{ github.event.issue.number }}
            ISSUE_BODY: |
              ${{ github.event.issue.body }}
            
            --------------------------------------------------
            SYSTEM INSTRUCTIONS:
            ${{ vars.JULES_ISSUE_DEVELOPER_PROMPT }}

      # 3. VERIFY LAUNCH LOGS: Read the runner log text to detect silent failures
      - name: Verify API Launch Success
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;

            // 1. Fetch the jobs for this workflow run to find our specific step logs
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: runId
            });

            const currentJob = jobs.jobs.find(j => j.status === 'in_progress' || j.name === 'trigger-jules');
            if (!currentJob) return;

            // 2. Download the raw log text for this job execution
            const { data: logText } = await github.rest.actions.downloadJobLogsForWorkflowRun({
              owner, repo, job_id: currentJob.id
            });

            // 3. Scan the log for the specific silent API error payload
            if (logText.includes('FAILED_PRECONDITION')) {
              core.setFailed("❌ Fatal: detected a silent 400 FAILED_PRECONDITION api failure in the Jules launch logs.");
            } else {
              console.log("✅ API logs confirmed a clean session deployment initialized.");
            }

      # 4. SELF-HEALING RECOVERY: This will now catch the forced failure from Step 3!
      - name: Revert Labels on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            const currentLabels = issue.labels.map(l => l.name);

            if (currentLabels.includes('jules-in-progress')) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'jules-in-progress' });
            }
            if (currentLabels.includes('jules-task')) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'jules-task' });
            }
            console.log(`Successfully reset Issue #${issue_number} labels following a log-verified launch failure.`);
