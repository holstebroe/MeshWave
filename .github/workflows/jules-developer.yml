name: Jules Issue Developer

on:
  issues:
    types: [opened, labeled]

jobs:
  implement-task:
    if: contains(github.event.issue.labels.*.name, 'jules-task')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - name: Run Jules Implementer
        uses: google-labs-code/jules-invoke@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          prompt: |
            ${{vars.JULES_ISSUE_DEVELOPER_PROMPT}}