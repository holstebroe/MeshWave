name: Jules Issue Developer

on:
  issues:
    types: [labeled]

jobs:
  trigger-jules:
    if: >
      github.event.label.name == 'jules-task' && 
      !contains(github.event.issue.labels.*.name, 'jules-in-progress') &&
      !contains(github.event.issue.labels.*.name, 'jules-under-review')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write       
      pull-requests: write  
      actions: read         # Crucial: Allows this job to read its own execution logs
    steps:
      # 1. Add the in-progress badge
      - name: Lock Issue to In-Progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['jules-in-progress']
            });
            
      # 2. Run Jules (which might fail silently with a green checkmark)
      - name: Run Jules Implementer
        id: jules_step
        uses: google-labs-code/jules-invoke@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          prompt: |
            ISSUE_TITLE: ${{ github.event.issue.title }}
            ISSUE_NUMBER: ${{ github.event.issue.number }}
            ISSUE_BODY: |
              ${{ github.event.issue.body }}
            
            --------------------------------------------------
            SYSTEM INSTRUCTIONS:
            ${{ vars.JULES_ISSUE_DEVELOPER_PROMPT }}

# 3. VERIFY LAUNCH LOGS: Local bash log scan to circumvent Azure Blob race conditions & extract error root causes
      - name: Verify API Launch Success
        id: check_logs
        run: |
          echo "Fetching live run logs via GitHub CLI..."
          # Grab the streaming console buffer for the current workflow run
          LOG_CONTENT=$(gh run view ${{ github.run_id }} --log 2>&1)
          
          # Check if the API returned an error payload
          if echo "$LOG_CONTENT" | grep -q '"error"'; then
            echo "=============================================================================="
            echo "❌ CRITICAL: Jules API failed to initialize properly."
            echo "=============================================================================="
            
            # Extract and print the specific message from the log to make debugging easy
            echo "Detailed Error Payload from API:"
            echo "$LOG_CONTENT" | grep -A 4 '"error"' || true
            echo "------------------------------------------------------------------------------"
            
            # Provide intelligent context based on the error text discovered
            if echo "$LOG_CONTENT" | grep -q "FAILED_PRECONDITION"; then
              echo "💡 DIAGNOSIS: FAILED_PRECONDITION"
              echo "This usually indicates a high-concurrency burst collision (too many Jules agents launching at the exact same second) or your Google AI Studio project hitting its concurrent session limit."
            elif echo "$LOG_CONTENT" | grep -q -E "403|PERMISSION_DENIED|API_KEY_INVALID"; then
              echo "💡 DIAGNOSIS: AUTHENTICATION FAILURE"
              echo "The JULES_API_KEY used by this runner appears to be invalid, restricted, or expired."
            elif echo "$LOG_CONTENT" | grep -q -E "429|QUOTA_EXCEEDED|RESOURCE_EXHAUSTED"; then
              echo "💡 DIAGNOSIS: QUOTA EXHAUSTED"
              echo "You have consumed your available token or request allocation for the day/minute tier."
            else
              echo "💡 DIAGNOSIS: General API request validation failure. Check issue payload formatting."
            fi
            echo "=============================================================================="
            
            # Force a clean, descriptive runner crash so the self-healing step triggers
            exit 1
          else
            echo "✅ API logs confirmed a clean session deployment initialized successfully."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. SELF-HEALING RECOVERY: This will now catch the forced failure from Step 3!
      - name: Revert Labels on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            const currentLabels = issue.labels.map(l => l.name);

            if (currentLabels.includes('jules-in-progress')) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'jules-in-progress' });
            }
            if (currentLabels.includes('jules-task')) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'jules-task' });
            }
            console.log(`Successfully reset Issue #${issue_number} labels following a log-verified launch failure.`);
