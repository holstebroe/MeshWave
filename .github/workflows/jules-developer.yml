name: Jules Issue Developer

on:
  issues:
    types: [labeled]

jobs:
  trigger-jules:
    # ONLY run if 'jules-task' was just added
    # AND we aren't already working on it or reviewing it
    if: >
      github.event.label.name == 'jules-task' && 
      !contains(github.event.issue.labels.*.name, 'jules-in-progress') &&
      !contains(github.event.issue.labels.*.name, 'jules-under-review')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Lock Issue to In-Progress
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "jules-in-progress"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Run Jules Implementer
        uses: google-labs-code/jules-invoke@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          prompt: |
            ${{ vars.JULES_ISSUE_DEVELOPER_PROMPT }}