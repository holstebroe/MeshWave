name: Daily Jules Fleet Worker

on:
  schedule:
    # Runs every day at 02:00 UTC (Adjust as needed)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows you to trigger this manually to test it!

jobs:
  triage-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clone the MeshWave repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Fetch open issues and save them to a markdown file
      - name: Gather Open Issues
        env:
          GH_TOKEN: ${{ secrets.JULES_AUTOMATION_TOKEN }}
        run: |
          echo "### Current Open Issues" > open_issues.md
          gh issue list --state open --limit 10 --json number,title,body --template '{{range .}}#### Issue #{{.number}}: {{.title}}\n{{.body}}\n---\n{{end}}' >> open_issues.md

      # Step 3: Use Jules to analyze code and dispatch parallel workers
      - name: Run Jules Fleet Planner
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            You are acting as the Core Fleet Architect for the MeshWave repository.
            
            1. Read the file `open_issues.md` which lists our active open issues.
            2. Inspect the current codebase architecture.
            3. Pick the top 3 to 5 issues that are independent, well-defined, and won't cause code conflicts with one another. (Do not exceed 5 issues to respect our daily session limits).
            4. For each selected issue, spawn a separate, autonomous child Jules session.
            5. Instruct each child session to fix its assigned issue on a clean, isolated branch, run validation tests, and submit a targeted Pull Request linked back to the issue via "Closes #IssueNumber".
