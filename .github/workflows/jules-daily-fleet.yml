name: Daily Jules Fleet Worker

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 02:00 UTC
  workflow_dispatch: # Allows manual trigger for testing

# Force the runner to use Node.js 24 to clear deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  triage-and-dispatch:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      # Step 1: Clone the MeshWave repo (giving access to ProjectPlan/ files)
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Extract GitHub issues and point to your project planning documents
      - name: Gather Master Task List
        env:
          GH_TOKEN: ${{ secrets.JULES_AUTOMATION_TOKEN }}
        run: |
          echo "# MASTER TRIAGE LIST" > combined_triage_list.md
          echo "## Section 1: Live GitHub Issue Tracker" >> combined_triage_list.md
          gh issue list --state open --limit 10 --json number,title,body --template '{{range .}}### Issue #{{.number}}: {{.title}}\n{{.body}}\n---\n{{end}}' >> combined_triage_list.md
          
          echo "## Section 2: Instructions for Project Plan Documents" >> combined_triage_list.md
          echo "You have internal project documents tracking our features. Please read and evaluate:" >> combined_triage_list.md
          echo "- \`ProjectPlan/Backlog.md\` (Contains immediate upcoming issues)" >> combined_triage_list.md
          echo "- \`ProjectPlan/Roadmap.md\` (Contains macro features/epics)" >> combined_triage_list.md

      # Step 3: Strip out the local network git rules before invoking Jules
      - name: Reset Git Global Config Overrides
        run: |
          git config --global --unset-all url.http://git@192.168.0.1:8080/.insteadOf || true

      # Step 4: Run Jules with updated analytical instructions
      - name: Run Jules Fleet Planner
        uses: google-labs-code/jules-invoke@v1.0.0
        env:
          GH_TOKEN: ${{ secrets.JULES_AUTOMATION_TOKEN }}
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          prompt: |
            You are acting as the Lead Systems Architect and Product Manager for the MeshWave workspace.
            
            Your goal is to cross-reference our internal project documents and outstanding live tracker requests to choose 3 high-priority tasks to work on today.
            
            EXECUTION STEPS:
            1. Read the file `combined_triage_list.md` to see active GitHub issues.
            2. Open and thoroughly parse `ProjectPlan/Backlog.md` and `ProjectPlan/Roadmap.md`. 
            3. Synthesize this information. If a live GitHub issue aligns with an item on the roadmap or backlog, prioritize it.
            4. Choose exactly 2 to 3 distinct, isolated engineering tasks. (Do not exceed 3 tasks total to strictly respect our daily computing quotas).
            5. For each chosen task, you must use the `run_in_bash_session` tool to create a new GitHub Issue using the `gh issue create` command.
            6. Each issue MUST have the label `jules-task` to trigger the Fleet Worker workflow.
            7. Ensure the issue body contains the detailed technical instructions you've drafted for the task, including context and success criteria.
            8. Update `ProjectPlan/Status.md` to list the newly created issue numbers.
