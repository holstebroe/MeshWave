name: Daily Jules Project Manager

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 02:00 UTC
  workflow_dispatch: # Allows manual trigger for testing

# Force the runner to use Node.js 24 to clear deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  triage-and-dispatch:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      # Clone the MeshWave repo (giving access to ProjectPlan/ files)
      - name: Checkout Code
        uses: actions/checkout@v4

      # Extract GitHub issues and point to your project planning documents
      - name: Gather Master Task List
        env:
          GH_TOKEN: ${{ secrets.JULES_AUTOMATION_TOKEN }}
        run: |
          echo "## Limited MeshWave GitHub Issue Tracker" > github_issues_list.md
          gh issue list --state open --limit 50 --json number,title,body --template '{{range .}}### Issue #{{.number}}: {{.title}}\n{{.body}}\n---\n{{end}}' >> github_issues_list.md

      # Run Jules with analytical instructions
      - name: Run Jules Fleet Planner
        uses: google-labs-code/jules-invoke@v1.0.0
        env:
          GH_TOKEN: ${{ secrets.JULES_AUTOMATION_TOKEN }}
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          prompt: |
            You are acting as the Lead Systems Architect and Product Manager for the MeshWave workspace.
            
            Your goal is to cross-reference our internal project documents and outstanding live tracker requests to choose 3 high-priority tasks to work on today.
            
            EXECUTION STEPS:
            1. Read the file `github_issues_list.md` to see a limited number of active GitHub issues.
            2. Open and thoroughly parse `ProjectPlan/Backlog.md` and `ProjectPlan/Roadmap.md`. 
            3. Synthesize this information. If a live GitHub issue aligns with an item on the roadmap or backlog, prioritize it.
            4. Choose 0 to 5 distinct, unresolved isolated engineering tasks. (Do not exceed 5 tasks total to strictly respect our daily computing quotas).
            5a. For each chosen task not already an GitHub issue, you must use the `run_in_bash_session` tool to create a new GitHub Issue using the `gh issue create` command.
            5b. For each chosen task that is already an GitHub issue, you must use the `run_in_bash_session` tool to update the issue instead by updating the description or add comments.
            6. Each issue MUST have the label `jules-task` to trigger the Fleet Worker workflow. 
            Add to existing GitHub issues if the label is not already there.
            7. Ensure the issue body contains the detailed technical instructions you've drafted for the task, including context and success criteria.
            8. Update `ProjectPlan/Status.md` to list the newly created issue numbers.
